<style>
  :root {
    box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #1c2238; --bg-deep: #13182a; --panel: #1c2440; --panel2: #2a3447;
    --tile-a: #2f6d78; --tile-b: #28606b; --counter: #1b2238;
    --path: #ff5a36; --path-soft: rgba(255,90,54,.3); --lamp: #ffe066; --text: #f7f2ea; --muted: #a3acc4;
    --fur: #8c7b6f; --fur2: #6f5f54; --cream: #f1e3cf; --mask: #3f342e; --ink: #2a1a06; --danger: #ff3b3b;
    --font: "Fredoka", "Trebuchet MS", "Segoe UI", sans-serif; --display: "Luckiest Guy", Impact, sans-serif;
  }
  :root[data-theme="light"] { --bg: #eef2f8; --bg-deep: #dfe6f2; --panel: #ffffff; --panel2: #d9e1ee; --tile-a: #9fd4c3; --tile-b: #8ac6b3; --counter: #6b7690; --text: #1b2238; --muted: #4c5670; --path: #ff5a36; }
  :root[data-kitchen="1"] { --tile-a: #6b5a8f; --tile-b: #5d4e7e; --counter: #241c3a; }
  :root[data-kitchen="2"] { --tile-a: #7a6a3c; --tile-b: #6a5c33; --counter: #2b2416; }
  :root[data-kitchen="3"] { --tile-a: #3e6b4e; --tile-b: #355d44; --counter: #16261c; }
  :root[data-theme="light"][data-kitchen="1"] { --tile-a: #c7b8e8; --tile-b: #b9a9df; } :root[data-theme="light"][data-kitchen="2"] { --tile-a: #e6d6a0; --tile-b: #dccb90; } :root[data-theme="light"][data-kitchen="3"] { --tile-a: #b2dcbf; --tile-b: #a3d1b1; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .screen { position: fixed; inset: 0; display: none; } .screen.show { display: block; }
  button { font-family: var(--font); cursor: pointer; }
  .btn { font-size: 20px; font-weight: 600; color: #2a1a06; background: linear-gradient(#ffd166, #ff9f43); border: 0; border-radius: 999px; padding: 12px 40px; box-shadow: 0 5px 0 #b85c1a, 0 8px 14px rgba(0,0,0,.3); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b85c1a; }
  .btn.small { font-size: 15px; padding: 9px 16px; background: linear-gradient(#e9eef8, #c9d3e6); box-shadow: 0 4px 0 #7d8aa6, 0 6px 10px rgba(0,0,0,.25); }
  .btn.quiet { background: var(--panel2); color: var(--text); box-shadow: 0 4px 0 rgba(0,0,0,.3); }
  .hbtn { font-size: 15px; font-weight: 600; color: var(--text); background: var(--panel2); border: 0; border-radius: 999px; padding: 8px 14px; }
  /* ---------- title ---------- */
  #title { background: #1b2b57; }
  #stage { position: relative; width: 100%; height: 100%; max-width: 480px; margin: 0 auto; overflow: hidden; }
  #bg { position: absolute; inset: 0; background: center 62% / 100% auto no-repeat #1b2b57; }
  #vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.45) 100%); pointer-events: none; }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #tTop { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 3; animation: fadeup .6s .2s both; }
  #tLeft { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .tchip { display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 999px; padding: 5px 12px 5px 5px; background: rgba(8,12,30,.72); color: #fff; font-family: var(--font); font-weight: 600; font-size: 14px; box-shadow: 0 3px 0 rgba(0,0,0,.35); max-width: 46vw; }
  .tchip .avatar { width: 30px; height: 30px; border: 2px solid #ffd166; flex: none; } .tchip span:not(.avatar) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tCloset { padding: 7px 12px 7px 10px; } .tchip.round { width: 40px; height: 40px; padding: 0; justify-content: center; font-size: 20px; }
  #logo { position: absolute; top: calc(58px + env(safe-area-inset-top, 0px)); left: 0; right: 0; text-align: center; padding: 0 12px; }
  .logoimg { width: min(92vw, 460px); height: auto; display: block; margin: 0 auto; filter: drop-shadow(0 8px 10px rgba(0,0,0,.45)); animation: drop .7s cubic-bezier(.2,1.4,.4,1) both, breathe 3.2s 1s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1) rotate(-1deg); } 50% { transform: scale(1.02) rotate(.5deg); } }
  .jp { font-family: "Mochiy Pop One", "Luckiest Guy", sans-serif; font-size: clamp(20px, 6.5vw, 32px); color: #ffe9b8; margin-top: -4px; letter-spacing: .06em; transform: rotate(-2deg); text-shadow: 2px 0 0 #16213a, -2px 0 0 #16213a, 0 2px 0 #16213a, 0 -2px 0 #16213a, 2px 2px 0 #16213a, -2px -2px 0 #16213a, 3px 3px 0 #c98f3c, 4px 4px 0 #c98f3c, 5px 5px 0 #c98f3c, 6px 6px 0 #16213a, 8px 10px 10px rgba(0,0,0,.45); display: none; }
  html[lang="ja"] .jp { display: block; }
  html[lang="ja"] #tag { top: calc(58px + env(safe-area-inset-top, 0px) + min(92vw, 460px) * 0.53 + 52px); }
  @keyframes drop { from { transform: translateY(-40px) scale(1.15); } to { transform: none; } }
  #tag { position: absolute; top: calc(58px + env(safe-area-inset-top, 0px) + min(92vw, 460px) * 0.53 + 14px); left: 0; right: 0; text-align: center; font-size: 16px; font-weight: 600; color: #fff5e6; text-shadow: 0 2px 0 rgba(0,0,0,.4); animation: fadeup 1s .5s both; padding: 0 16px; }
  @keyframes fadeup { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  #tbuttons { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 12px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 10px; background: linear-gradient(rgba(8,12,30,0), rgba(8,12,30,.78) 30%, rgba(8,12,30,.92)); animation: rise .8s 1.4s cubic-bezier(.2,1,.3,1) both; }
  @keyframes rise { from { transform: translateY(110%); } to { transform: none; } }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  @media (orientation: landscape) and (min-width: 700px) { #stage { max-width: none; } #bg { background-size: cover; background-position: center; } #logo { left: 4%; right: auto; width: 42%; top: 16%; } #tag { left: 4%; right: auto; width: 42%; top: 50%; } #tTop { left: 4%; right: 4%; } #tbuttons { left: 4%; right: auto; width: 42%; bottom: 6%; background: none; } }
  #tver { position: absolute; bottom: calc(4px + env(safe-area-inset-bottom, 0px)); right: 10px; font-size: 11px; opacity: .6; color: #fff; }
  /* ---------- game ---------- */
  #game { display: none; } #game.show { display: flex; flex-direction: column; align-items: center; }
  header { width: 100%; max-width: 520px; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px 4px; }
  #levelNum { font-size: 26px; font-weight: 600; } #levelNum small { font-size: 14px; font-weight: 400; color: var(--muted); margin-right: 6px; }
  main { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; padding: 6px; }
  #board { width: min(96vw, 520px, 70vh); height: auto; display: block; touch-action: none; }
  footer { width: 100%; max-width: 520px; display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 12px; font-size: 14px; }
  #spotted { font-size: 13px; background: rgba(255,59,59,.22); border-radius: 999px; padding: 4px 10px; display: none; } #spotted.show { display: inline-block; } #spotted b { color: var(--danger); }
  #ver { font-size: 11px; color: var(--muted); margin-left: 10px; }
  .missed { animation: blink .5s ease-in-out 2; }
  .glow { animation: glow 1.2s ease-in-out 3; } @keyframes glow { 50% { fill: var(--lamp); } }
  .spot { pointer-events: none; } @keyframes blink { 50% { fill: var(--danger); } }
  #raccoon .pupil { opacity: 1; } #raccoon .xeye { opacity: 0; } #raccoon.dead .pupil { opacity: 0; } #raccoon.dead .xeye { opacity: 1; }
  /* ---------- overlays ---------- */
  .ov { position: fixed; inset: 0; background: rgba(8,12,30,.75); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 8; }
  .ov.show { display: flex; }
  .card { background: var(--panel); border-radius: 22px; padding: 20px 18px 16px; width: 100%; max-width: 380px; max-height: 84vh; overflow: auto; text-align: center; }
  .card h2 { margin: 0 0 6px; font-size: 24px; font-weight: 600; } .card p { margin: 0 0 14px; color: var(--muted); font-size: 15px; line-height: 1.35; }
  .card svg { width: 140px; height: 140px; display: block; margin: 0 auto 8px; }
  .card input { width: 100%; box-sizing: border-box; font-family: var(--font); font-size: 20px; text-align: center; padding: 12px; border-radius: 14px; border: 2px solid var(--panel2); background: var(--bg-deep); color: var(--text); margin-bottom: 12px; }
  .card ul { text-align: left; padding-left: 18px; color: var(--text); margin: 0 0 14px; } .card li { margin-bottom: 6px; }
  .lgrid { display: grid; grid-template-columns: repeat(5, 54px); gap: 8px; justify-content: center; margin-bottom: 14px; }
  .lcell { font-size: 15px; font-weight: 600; height: 46px; border: 0; border-radius: 12px; background: var(--panel2); color: var(--text); } .lcell.done { background: var(--tile-a); } .lcell.current { outline: 3px solid var(--path); } .lcell:disabled { opacity: .3; }
  .menuh { display: flex; align-items: center; justify-content: space-between; margin: 10px 0 6px; } .menuh h3 { margin: 0; font-size: 17px; font-weight: 600; } .menuh button { background: none; border: 0; color: var(--muted); font-size: 14px; }

function nameProblem(v) {   // '' = fine; returns a string key of T otherwise
  const raw = v.trim(); if (raw.replace(/\s/g, '').length < 2) return 'nameShort';
  let n = raw.normalize('NFKC').toLowerCase().replace(/[\s._\-]/g, '');
  n = n.replace(/0/g, 'o').replace(/1/g, 'i').replace(/3/g, 'e').replace(/4/g, 'a').replace(/5/g, 's').replace(/7/g, 't').replace(/@/g, 'a').replace(/\$/g, 's').replace(/!/g, 'i');

  for (const b of BAD_WORDS) if (n.includes(b) || kata.includes(b)) return 'nameBad';
  return '';
}

$('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('nameOk').click(); });
function showNews() { if (store.get(K.news, '') === VERSION) return; $('newsTitle').textContent = t().newsTitle; $('newsList').innerHTML = NEWS.map(x => `<li>${x}</li>`).join(''); $('newsOk').textContent = t().newsOk; $('newsOv').classList.add('show'); }
$('newsOk').addEventListener('click', () => { store.set(K.news, VERSION); $('newsOv').classList.remove('show'); askName(false); });
function endScreen() { sfx.clear(); log.event('all_levels_complete', {}); const s = log.summary(); $('endTitle').textContent = t().endTitle; $('endStats').textContent = t().endStats(s.levelsDone, s.fails, Math.round(s.playSecs / 60)); $('playCode').textContent = log.playCode(); $('copyCode').textContent = t().copyCode; $('endBack').textContent = t().title; $('endOv').classList.add('show'); }
$('copyCode').addEventListener('click', () => copyText(log.playCode())); $('endBack').addEventListener('click', () => { $('endOv').classList.remove('show'); showScreen('title'); applyLang(); });

/* ---------- title screen ---------- */
$('logo').innerHTML = `<img class="logoimg" src="${SPR.logo}" alt="Kitchen Heist"><div class="jp">キッチン・ハイスト</div>`;
$('tver').textContent = VERSION; $('ver').textContent = VERSION;
/* title scene per animal: painted scene from assets/ (the character-less scene + live sprite replaces this once drawn); the costume's head part is pinned to the painted head */
const TITLE_SCENES = { raccoon: { p: ext('title_raccoon_p') || ext('bgp'), l: ext('title_raccoon_l') || ext('bgl'), headP: [0.67, 0.655, 0.21], headL: [0.72, 0.76, 0.1] }, rabbit: { p: ext('title_rabbit_p') || ext('title_rabbit_l'), l: ext('title_rabbit_l'), headP: [0.8, 0.5, 0.11], headL: [0.8, 0.48, 0.1] } };
function titleScene() {
  const sc = TITLE_SCENES[animal()] || TITLE_SCENES.raccoon, land = matchMedia('(orientation: landscape) and (min-width: 700px)').matches, src = land ? sc.l : sc.p; if (!src) return;
  const bg = $('bg'); bg.style.backgroundImage = `url(${src})`; bg.style.backgroundSize = (land || !sc.p || src === sc.l) ? 'cover' : '100% auto'; bg.style.backgroundPosition = (land || src === sc.l) ? 'center' : 'center 62%';
  const tc = $('tcos'); tc.innerHTML = ''; const C = COSTUMES[costume()], hat = C && C.parts.find(p => p.at === 'head' && ext(p.img)); if (!hat) return;
  const img = new Image(); img.onload = () => {
    const st = $('stage').getBoundingClientRect(), W = st.width, H = st.height; let dw, dh, ox, oy;
    if (bg.style.backgroundSize === 'cover') { const k = Math.max(W / img.width, H / img.height); dw = img.width * k; dh = img.height * k; ox = (W - dw) / 2; oy = (H - dh) / 2; } else { dw = W; dh = W * img.height / img.width; ox = 0; oy = (H - dh) * 0.62; }
    const hd = (bg.style.backgroundSize === 'cover' || src === sc.l) ? sc.headL : sc.headP, hx = ox + hd[0] * dw, hy = oy + hd[1] * dh, hw = hd[2] * dw * hat.w;
    tc.innerHTML = `<img src="${ext(hat.img)}" style="left:${hx + (hat.dx || 0) * hw / 46 - hw / 2}px;top:${hy + (hat.dy || 0) * hw - hw / 2}px;width:${hw}px;transform:rotate(${hat.rot || 0}deg)">`;
  }; img.src = src;
}
window.addEventListener('resize', () => { if ($('title').classList.contains('show')) titleScene(); });
(function fxLoop() {
  const fx = $('fx'), stars = [], crumbs = [];
  for (let i = 0; i < 9; i++) { const c = el('circle', { r: .35 + Math.random() * .4, fill: '#fff' }, fx); stars.push({ el: c, x: 62 + Math.random() * 34, y: 38 + Math.random() * 22, ph: Math.random() * 6 }); }
  for (let i = 0; i < 14; i++) { const c = el('circle', { r: .3 + Math.random() * .35, fill: '#d89a4a' }, fx); crumbs.push({ el: c, x: 20 + Math.random() * 40, y: 72 + Math.random() * 14, vx: .4 + Math.random() * .6, ph: Math.random() * 6 }); }
  const t0 = performance.now();
  (function loop(now) { if ($('title').classList.contains('show')) { const tt = (now - t0) / 1000; for (const s of stars) { s.el.setAttribute('cx', s.x); s.el.setAttribute('cy', s.y); s.el.setAttribute('opacity', .3 + .7 * Math.abs(Math.sin(tt * 1.3 + s.ph))); } for (const c of crumbs) { const u = ((tt * c.vx + c.ph) % 6) / 6; c.el.setAttribute('cx', c.x + u * 10); c.el.setAttribute('cy', c.y - Math.sin(u * Math.PI) * 6); c.el.setAttribute('opacity', 1 - u); } } requestAnimationFrame(loop); })(t0);
})();
$('tPlay').addEventListener('click', () => { sfx.ui(); const go = () => loadLevel(Math.min(maxLevel(), LEVEL_COUNT)); if (!store.get(K.name, '')) askName(false, go); else go(); });
$('tDaily').addEventListener('click', () => { sfx.ui(); if (!store.get(K.name, '')) { askName(false, loadDaily); return; } loadDaily(); });
$('tLevels').addEventListener('click', () => { sfx.ui(); openMap(); });
$('tLb').addEventListener('click', () => { sfx.ui(); openLeaderboard(); });
$('tSettings').addEventListener('click', () => { sfx.ui(); openSettings(); });
$('menuBtn').addEventListener('click', () => { if (game.daily || game.garden) openMenu(); else openWorld(WORLDS.indexOf(worldOf(game.bonus ? WORLDS.find(w => w.bonus === game.n - 41).from : game.n))); }); $('mDaily').addEventListener('click', () => { $('menuOv').classList.remove('show'); loadDaily(); }); $('mLb').addEventListener('click', () => { $('menuOv').classList.remove('show'); openLeaderboard(); }); $('mSettings').addEventListener('click', () => { $('menuOv').classList.remove('show'); openSettings(); }); $('mTitle').addEventListener('click', () => { $('menuOv').classList.remove('show'); showScreen('title'); applyLang(); }); $('menuClose').addEventListener('click', () => $('menuOv').classList.remove('show'));
$('lbClose').addEventListener('click', () => $('lbOv').classList.remove('show'));
$('retry').addEventListener('click', () => { if (game.locked) return; document.querySelectorAll('.glowLoop').forEach(e => e.classList.remove('glowLoop')); game.path = [game.L.start]; game.snackIdx = 0; drawPath(); updateRaccoon(); sfx.back(); log.event('restart', { lvl: game.n, rule: game.L.rule }); });
board.addEventListener('pointerdown', onDown); board.addEventListener('pointermove', onMove); board.addEventListener('pointerup', onUp); board.addEventListener('pointercancel', () => { log.event('pointer_cancel', { lvl: game.n }); onUp(); });
board.addEventListener('touchstart', e => e.preventDefault(), { passive: false }); board.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

/* ---------- boot ---------- */
log.load(); applyTheme(); applyLang(); document.documentElement.setAttribute('data-animal', animal()); log.event('boot_ok', { w: innerWidth, h: innerHeight });
if (location.hash.includes('daily')) loadDaily();
else {
  showScreen('title');
  const newPlayer = !store.get(K.name, '') && maxLevel() === 1 && !store.get(K.news, '');   // first session: straight to the title, no cards (name is asked at the first leaderboard / daily / profile)
  if (newPlayer) log.event('new_player', {}); else { showNews(); if (store.get(K.news, '') === VERSION) askName(false); }
  walletDailyFree();
}
</script>
</body>
</html>
